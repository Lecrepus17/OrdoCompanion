<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="application-name" content="Ordo Companion" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <script>
      (function () {
        if (typeof window === 'undefined') return;
        window.__ordoDeferredPwaPrompt = window.__ordoDeferredPwaPrompt || null;
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          window.__ordoDeferredPwaPrompt = event;
          try {
            window.dispatchEvent(new CustomEvent('ordo:pwa-install-ready'));
          } catch (e) {}
        });
        window.addEventListener('appinstalled', function () {
          window.__ordoDeferredPwaPrompt = null;
          try {
            window.dispatchEvent(new CustomEvent('ordo:pwa-installed'));
          } catch (e) {}
        });
        if (
          typeof navigator !== 'undefined' &&
          'serviceWorker' in navigator &&
          (window.location.protocol === 'http:' || window.location.protocol === 'https:')
        ) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').then(function (reg) {
              if (reg && typeof reg.update === 'function') {
                reg.update().catch(function () {});
              }
            }).catch(function () {});
          });
        }
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        flex: 1;
      }
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.32);
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
